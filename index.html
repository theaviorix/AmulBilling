<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Order &amp; Billing Manager</title>
<style>
  :root{
    --bg:#f0f2f5; --card:#ffffff; --border:#e4e8ee; --text:#1a1f2e; --muted:#8492a6;
    --primary:#3b5bdb; --primary-dark:#2f4ac4; --danger:#e03131; --success:#2f9e44;
    --gave-bg:#fff5f5; --got-bg:#f0fff4;
    --nav-h:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;}

  /* ── HEADER ── */
  header{
    padding:12px 16px;background:var(--primary);color:#fff;
    display:flex;justify-content:space-between;align-items:center;
    position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(59,91,219,.25);
    flex-shrink:0;
  }
  .header-left h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px;}

  /* ── MAIN SCROLL AREA ── */
  main{flex:1;overflow-y:auto;padding:14px 12px calc(var(--nav-h) + 14px);max-width:480px;margin:0 auto;width:100%;}

  /* ── BOTTOM NAV ── */
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);border-top:1px solid var(--border);
    display:flex;z-index:100;
    box-shadow:0 -2px 12px rgba(0,0,0,.07);
  }
  .bottom-nav button{
    flex:1;padding:8px 4px;border:none;background:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10px;color:var(--muted);font-weight:500;transition:color .15s;
  }
  .bottom-nav button.active{color:var(--primary);}
  .bottom-nav button .nav-icon{font-size:22px;line-height:1;}
  .bottom-nav button .nav-label{font-size:10px;letter-spacing:.01em;}

  /* ── CARDS ── */
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  h2{font-size:16px;margin:0 0 12px;font-weight:700;}
  h3{font-size:11px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}

  /* ── OVERVIEW STATS ── */
  .overview-header{margin-bottom:6px;}
  .overview-header h2{margin-bottom:2px;font-size:17px;}
  .overview-header .sub{font-size:12px;color:var(--muted);}

  .balance-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .balance-tile{border-radius:12px;padding:14px 12px;text-align:center;}
  .balance-tile.give{background:var(--gave-bg);border:1px solid #ffc9c9;}
  .balance-tile.get{background:var(--got-bg);border:1px solid #b2f2bb;}
  .balance-tile .bt-label{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .balance-tile .bt-amount{font-size:20px;font-weight:800;letter-spacing:-.5px;}
  .balance-tile.give .bt-amount{color:var(--danger);}
  .balance-tile.get .bt-amount{color:var(--success);}

  .mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .mini-stat{background:#f7f9fc;border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
  .mini-stat .ms-num{font-size:22px;font-weight:800;letter-spacing:-.5px;}
  .mini-stat .ms-label{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500;}

  /* ── RECENT TRANSACTIONS (dashboard) ── */
  .recent-txn-item{
    display:flex;align-items:center;gap:10px;
    padding:11px 0;border-bottom:1px solid var(--border);
  }
  .recent-txn-item:last-child{border-bottom:none;padding-bottom:0;}
  .rta-avatar{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;flex-shrink:0;
  }
  .rta-avatar.gave{background:var(--gave-bg);color:var(--danger);}
  .rta-avatar.got{background:var(--got-bg);color:var(--success);}
  .rta-body{flex:1;min-width:0;}
  .rta-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rta-detail{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rta-right{text-align:right;flex-shrink:0;}
  .rta-amount{font-size:14px;font-weight:700;}
  .rta-amount.gave{color:var(--danger);}
  .rta-amount.got{color:var(--success);}
  .rta-date{font-size:10px;color:var(--muted);margin-top:1px;}

  /* ── QUICK ACTIONS (dashboard bottom) ── */
  .quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .qa-btn{
    background:#f0f4ff;border:1.5px solid #c5d0f5;border-radius:12px;
    padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;
    cursor:pointer;transition:background .15s;
  }
  .qa-btn:hover{background:#dde5ff;}
  .qa-icon{font-size:22px;line-height:1;}
  .qa-label{font-size:12px;font-weight:600;color:var(--primary);text-align:center;line-height:1.2;}

  /* ── TABLE ── */
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  tr.clickable{cursor:pointer;}
  tr.clickable:hover{background:#f7f9fc;}

  /* ── FORMS ── */
  input,select{padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;width:100%;background:#fff;outline:none;appearance:none;-webkit-appearance:none;}
  input:focus,select:focus{border-color:var(--primary);}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;font-weight:500;}
  .form-row{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px;}
  .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}

  /* ── BUTTONS ── */
  .btn{padding:11px 16px;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:700;width:100%;display:block;text-align:center;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-secondary{background:#eef0f3;color:var(--text);}
  .btn-danger{background:#fff;color:var(--danger);border:1.5px solid var(--danger);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-sm{padding:6px 12px;font-size:12px;width:auto;display:inline-block;border-radius:8px;}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;}

  /* ── MISC ── */
  .empty{color:var(--muted);font-size:14px;padding:24px 0;text-align:center;}
  .error-text{color:var(--danger);font-size:13px;margin-top:6px;min-height:1px;}
  .muted-small{font-size:12px;color:var(--muted);}
  tfoot .total-row td{font-weight:700;font-size:15px;border-top:2px solid var(--text);border-bottom:none;}
  .footer-note{text-align:center;color:var(--muted);font-size:11px;padding:6px 0 10px;background:var(--bg);}
  .footer-note a{color:var(--muted);text-decoration:underline;cursor:pointer;}

  /* ── CUSTOMER DETAIL ── */
  .cust-detail-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:10px;}
  .cust-detail-header h2{margin-bottom:2px;}
  .balance-box{border-radius:14px;padding:20px;text-align:center;margin:14px 0;}
  .balance-box.pos{background:var(--gave-bg);}
  .balance-box.neg{background:var(--got-bg);}
  .balance-box.zero{background:#f0f2f5;}
  .balance-label{font-size:13px;color:var(--muted);margin-bottom:4px;}
  .balance-amount{font-size:30px;font-weight:800;letter-spacing:-.5px;}
  .balance-box.pos .balance-amount{color:var(--danger);}
  .balance-box.neg .balance-amount{color:var(--success);}
  .gave-got-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .btn-gave{background:var(--danger);color:#fff;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;width:100%;}
  .btn-got{background:var(--success);color:#fff;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:700;cursor:pointer;width:100%;}
  .panel{border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;background:#fbfcfd;}
  .txn-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--border);}
  .txn-row:last-child{border-bottom:none;}
  .txn-main{display:flex;flex-direction:column;}
  .txn-type{font-size:13px;font-weight:700;}
  .txn-type.gave{color:var(--danger);}
  .txn-type.got{color:var(--success);}
  .txn-date{font-size:11px;color:var(--muted);}
  .txn-detail{font-size:12px;color:var(--muted);flex:1;padding:0 6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .txn-amount{font-weight:700;font-size:14px;white-space:nowrap;}
  .txn-amount.gave{color:var(--danger);}
  .txn-amount.got{color:var(--success);}

  .section-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .section-title-row h3{margin:0;}
  .see-all{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer;background:none;border:none;padding:0;}

  /* ── TRANSACTION ROW ACTIONS ── */
  .txn-row{position:relative;}
  .txn-actions{display:flex;gap:6px;margin-top:5px;}
  .txn-edit-btn{font-size:11px;color:var(--primary);background:none;border:none;cursor:pointer;padding:0;font-weight:600;}
  .txn-delete-btn{font-size:11px;color:var(--danger);background:none;border:none;cursor:pointer;padding:0;font-weight:600;}

  /* ── IMAGE ATTACHMENT ── */
  .img-upload-label{display:flex;align-items:center;gap:8px;cursor:pointer;padding:9px 12px;border:1.5px dashed var(--border);border-radius:10px;font-size:13px;color:var(--muted);background:#fafbfc;transition:border-color .15s;}
  .img-upload-label:hover{border-color:var(--primary);color:var(--primary);}
  .img-upload-label input[type=file]{display:none;}
  .txn-img-thumb{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--border);}
  .txn-img-preview-wrap{position:relative;display:inline-block;}
  .txn-img-remove{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:13px;line-height:20px;text-align:center;padding:0;}

  /* ── EDIT TRANSACTION MODAL ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal-box{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.18);}
  .modal-title{font-size:16px;font-weight:700;margin:0 0 16px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}

  /* ── SPLASH SCREEN ── */
  #splash{
    position:fixed;inset:0;background:#ffffff;z-index:999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:1;transition:opacity 0.7s ease;
  }
  #splash.fade-out{opacity:0;pointer-events:none;}
  #splash img{
    width:min(340px, 80vw);
    opacity:0;
    transform:scale(0.88);
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  #splash img.visible{opacity:1;transform:scale(1);}
  #splash-tagline{
    font-size:13px;color:#aaa;margin-top:18px;letter-spacing:.08em;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    opacity:0;transition:opacity 0.5s ease 0.4s;
  }
  #splash-tagline.visible{opacity:1;}
</style>
</head>

<header>
  <div class="header-left">
    <h1>Order &amp; Billing</h1>
  </div>
</header>

<main id="main-content">
  <p class="empty">Loading…</p>
</main>

<script>
/* ============== STATE ============== */
var state = { products: [], customers: [], transactions: [] };
var STORAGE_KEY = 'supplier-app-state-v2';

var activeTab = 'dashboard';
var editingProductId = null;
var viewingCustomerId = null;
var editingCustomerDetail = false;
var activePanel = null;
var draftGaveItems = [];
var editingTxnId = null;
var pendingImageData = null;

/* ============== HELPERS ============== */
function genId(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
function rupeesToPaise(v){ var n = Number(v); if (isNaN(n)) return 0; return Math.round(n * 100); }
function paiseToDisplay(p){ var sign = p < 0 ? '-' : ''; return sign + '₹' + (Math.abs(p) / 100).toFixed(2); }
function fmtDate(iso){
  var d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}
function fmtDateShort(iso){
  var d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
}
function customerBalancePaise(customerId){
  return state.transactions.filter(function(t){ return t.customerId === customerId; })
    .reduce(function(s, t){ return s + (t.type === 'gave' ? t.amountPaise : -t.amountPaise); }, 0);
}
function totalGavePaise(){
  return state.transactions.filter(function(t){ return t.type === 'gave'; })
    .reduce(function(s, t){ return s + t.amountPaise; }, 0);
}
function totalGotPaise(){
  return state.transactions.filter(function(t){ return t.type === 'got'; })
    .reduce(function(s, t){ return s + t.amountPaise; }, 0);
}
function getCustomerName(id){
  var c = state.customers.find(function(x){ return x.id === id; });
  return c ? c.name : '?';
}
function avatarInitials(name){
  var parts = name.trim().split(/\s+/);
  return parts.length >= 2
    ? (parts[0][0] + parts[1][0]).toUpperCase()
    : name.slice(0,2).toUpperCase();
}

/* ============== PERSISTENCE ============== */
function loadState(){
  if (!window.storage) return Promise.resolve();
  return window.storage.get(STORAGE_KEY, false).then(function(res){
    if (res && res.value) {
      try { state = JSON.parse(res.value); } catch (e) {}
    }
  }).catch(function(){});
}
function saveState(){
  if (!window.storage) return;
  window.storage.set(STORAGE_KEY, JSON.stringify(state), false).catch(function(e){ console.error('Save failed', e); });
}

/* ============== INIT ============== */
document.addEventListener('DOMContentLoaded', function(){
  // Splash animation
  var splashLogo = document.getElementById('splash-logo');
  var splashTagline = document.getElementById('splash-tagline');
  var splash = document.getElementById('splash');

  // Trigger logo fade-in after a tiny delay
  setTimeout(function(){ splashLogo.classList.add('visible'); }, 80);
  setTimeout(function(){ splashTagline.classList.add('visible'); }, 200);

  // Load state while splash shows
  loadState().then(function(){
    render();
    // Fade out splash after 1.8s total
    setTimeout(function(){
      splash.classList.add('fade-out');
      setTimeout(function(){ splash.style.display = 'none'; }, 750);
    }, 1800);
  });
});

/* ============== NAV / RENDER DISPATCH ============== */
var TABS = [
  { key: 'dashboard', label: 'Home',      icon: '🏠' },
  { key: 'products',  label: 'Products',  icon: '📦' },
  { key: 'customers', label: 'Customers', icon: '👥' }
];

function switchTab(key){
  activeTab = key;
  if (key === 'customers') { viewingCustomerId = null; activePanel = null; editingCustomerDetail = false; }
  render();
}
function openCustomerDetail(id){
  activeTab = 'customers';
  viewingCustomerId = id;
  activePanel = null;
  editingCustomerDetail = false;
  draftGaveItems = [];
  render();
}

function render(){
  renderNav();
  var main = document.getElementById('main-content');
  if (activeTab === 'dashboard') main.innerHTML = renderDashboardTab();
  else if (activeTab === 'products') main.innerHTML = renderProductsTab();
  else main.innerHTML = viewingCustomerId ? renderCustomerDetail() : renderCustomersTab();
}

function renderNav(){
  var nav = document.getElementById('bottom-nav');
  nav.innerHTML = TABS.map(function(t){
    return '<button class="' + (activeTab === t.key ? 'active' : '') + '" onclick="switchTab(\'' + t.key + '\')">' +
      '<span class="nav-icon">' + t.icon + '</span>' +
      '<span class="nav-label">' + t.label + '</span>' +
    '</button>';
  }).join('');
}

/* ====================================================
   DASHBOARD TAB
==================================================== */
function renderDashboardTab(){
  /* ── Overview card ── */
  var overviewHtml =
    '<div class="card">' +
      '<div class="overview-header">' +
        '<h2>Overview</h2>' +
        '<div class="sub">' + new Date().toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'long'}) + '</div>' +
      '</div>' +
      '<div class="balance-row" style="margin-top:12px;">' +
        '<div class="balance-tile give">' +
          '<div class="bt-label">You Gave</div>' +
          '<div class="bt-amount">' + paiseToDisplay(totalGavePaise()) + '</div>' +
        '</div>' +
        '<div class="balance-tile get">' +
          '<div class="bt-label">You Received</div>' +
          '<div class="bt-amount">' + paiseToDisplay(totalGotPaise()) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="mini-stats">' +
        '<div class="mini-stat"><div class="ms-num">' + state.customers.length + '</div><div class="ms-label">Customers</div></div>' +
        '<div class="mini-stat"><div class="ms-num">' + state.products.length + '</div><div class="ms-label">Products</div></div>' +
      '</div>' +
    '</div>';

  /* ── Recent transactions card ── */
  var allTxns = state.transactions.slice()
    .sort(function(a, b){ return new Date(b.date) - new Date(a.date); })
    .slice(0, 10);

  var recentHtml;
  if (!allTxns.length) {
    recentHtml = '<div class="card">' +
      '<h3>Recent Transactions</h3>' +
      '<p class="empty">No transactions yet.<br>Add a customer to get started.</p>' +
    '</div>';
  } else {
    var items = allTxns.map(function(t){
      var custName = getCustomerName(t.customerId);
      var initials = avatarInitials(custName);
      var detail = t.type === 'gave'
        ? t.items.map(function(i){ return i.name + ' ×' + i.qty; }).join(', ')
        : (t.note || 'Payment received');
      return '<div class="recent-txn-item" onclick="openCustomerDetail(\'' + t.customerId + '\')" style="cursor:pointer;">' +
        '<div class="rta-avatar ' + t.type + '">' + esc(initials) + '</div>' +
        '<div class="rta-body">' +
          '<div class="rta-name">' + esc(custName) + '</div>' +
          '<div class="rta-detail">' + esc(detail) + '</div>' +
        '</div>' +
        '<div class="rta-right">' +
          '<div class="rta-amount ' + t.type + '">' + (t.type === 'gave' ? '-' : '+') + paiseToDisplay(t.amountPaise) + '</div>' +
          '<div class="rta-date">' + fmtDateShort(t.date) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
    recentHtml = '<div class="card">' +
      '<div class="section-title-row">' +
        '<h3>Recent Transactions</h3>' +
        '<button class="see-all" onclick="switchTab(\'customers\')">See all →</button>' +
      '</div>' +
      items +
    '</div>';
  }

  /* ── Quick action buttons ── */
  var quickHtml =
    '<div class="card">' +
      '<h3>Quick Actions</h3>' +
      '<div class="quick-actions">' +
        '<button class="qa-btn" onclick="switchTab(\'products\')">' +
          '<span class="qa-icon">📦</span><span class="qa-label">Add Product</span>' +
        '</button>' +
        '<button class="qa-btn" onclick="switchTab(\'customers\')">' +
          '<span class="qa-icon">👤</span><span class="qa-label">Manage Customers</span>' +
        '</button>' +
      '</div>' +
    '</div>' +
    '<div class="footer-note">Order &amp; Billing Manager &nbsp;|&nbsp; <a onclick="resetAllData()" style="color:var(--danger);font-weight:600;">🗑 Reset All Data</a></div>';

  return overviewHtml + recentHtml + quickHtml;
}

/* ====================================================
   PRODUCTS TAB
==================================================== */
function renderProductsTab(){
  var editing = editingProductId ? state.products.find(function(p){ return p.id === editingProductId; }) : null;
  var formHtml =
    '<div class="card">' +
      '<h2>' + (editing ? 'Edit Product' : 'Add Product') + '</h2>' +
      '<div class="form-row">' +
        '<div><label>Product Name *</label><input id="prod-name" type="text" placeholder="e.g. Basmati Rice 25kg" value="' + (editing ? esc(editing.name) : '') + '"></div>' +
        '<div><label>Price per Unit (₹) *</label><input id="prod-price" type="number" step="0.01" min="0.01" placeholder="e.g. 1200.00" value="' + (editing ? editing.price : '') + '"></div>' +
      '</div>' +
      '<div class="row-actions">' +
        '<button class="btn btn-primary btn-sm" onclick="saveProductFromForm()">' + (editing ? 'Update Price' : '+ Add Product') + '</button>' +
        (editing ? '<button class="btn btn-secondary btn-sm" onclick="cancelEditProduct()">Cancel</button>' : '') +
      '</div>' +
      '<div id="prod-error" class="error-text"></div>' +
      '<p class="muted-small" style="margin-top:8px;">Price updates won\'t change past transactions.</p>' +
    '</div>';

  var listHtml;
  if (!state.products.length) {
    listHtml = '<div class="card"><p class="empty">No products yet. Add your first product above.</p></div>';
  } else {
    var rows = state.products.map(function(p){
      return '<tr>' +
        '<td><div style="font-weight:600;">' + esc(p.name) + '</div></td>' +
        '<td style="font-weight:600;">₹' + Number(p.price).toFixed(2) + '</td>' +
        '<td><div class="row-actions">' +
          '<button class="btn btn-secondary btn-sm" onclick="editProduct(\'' + p.id + '\')">Edit</button>' +
          '<button class="btn btn-danger btn-sm" onclick="deleteProduct(\'' + p.id + '\')">Del</button>' +
        '</div></td>' +
      '</tr>';
    }).join('');
    listHtml = '<div class="card"><h2>Products (' + state.products.length + ')</h2>' +
      '<div class="table-wrap"><table><thead><tr><th>Name</th><th>Price</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
  }
  return formHtml + listHtml;
}

function saveProductFromForm(){
  var name = document.getElementById('prod-name').value.trim();
  var price = parseFloat(document.getElementById('prod-price').value);
  var errEl = document.getElementById('prod-error');
  errEl.textContent = '';
  if (!name) { errEl.textContent = 'Product name is required.'; return; }
  if (isNaN(price) || price <= 0) { errEl.textContent = 'Enter a valid price greater than 0.'; return; }
  var dupe = state.products.find(function(p){ return p.name.toLowerCase() === name.toLowerCase() && p.id !== editingProductId; });
  if (dupe) { errEl.textContent = 'A product with this name already exists.'; return; }
  if (editingProductId) {
    var p = state.products.find(function(x){ return x.id === editingProductId; });
    p.name = name; p.price = price;
    editingProductId = null;
  } else {
    state.products.push({ id: genId('prod'), name: name, price: price });
  }
  saveState(); render();
}
function editProduct(id){ editingProductId = id; render(); }
function cancelEditProduct(){ editingProductId = null; render(); }
function deleteProduct(id){
  if (!confirm('Delete this product? Past transactions will keep their original name and price.')) return;
  state.products = state.products.filter(function(p){ return p.id !== id; });
  saveState(); render();
}

/* ====================================================
   CUSTOMERS TAB
==================================================== */
function renderCustomersTab(){
  var formHtml =
    '<div class="card">' +
      '<h2>Add Customer</h2>' +
      '<div class="form-row">' +
        '<div><label>Name / Business ID *</label><input id="cust-name" type="text" placeholder="e.g. Sharma Traders"></div>' +
        '<div><label>Phone (optional)</label><input id="cust-phone" type="tel" placeholder="e.g. 9876543210"></div>' +
      '</div>' +
      '<button class="btn btn-primary" onclick="addCustomerFromList()">+ Add Customer</button>' +
      '<div id="cust-error" class="error-text"></div>' +
    '</div>';

  var listHtml;
  if (!state.customers.length) {
    listHtml = '<div class="card"><p class="empty">No customers yet. Add your first customer above.</p></div>';
  } else {
    var items = state.customers.map(function(c){
      var bal = customerBalancePaise(c.id);
      var balClass = bal > 0 ? 'txn-type gave' : (bal < 0 ? 'txn-type got' : 'muted-small');
      var initials = avatarInitials(c.name);
      return '<div class="recent-txn-item" onclick="openCustomerDetail(\'' + c.id + '\')" style="cursor:pointer;">' +
        '<div class="rta-avatar ' + (bal > 0 ? 'gave' : 'got') + '">' + esc(initials) + '</div>' +
        '<div class="rta-body">' +
          '<div class="rta-name">' + esc(c.name) + '</div>' +
          '<div class="rta-detail">' + esc(c.phone || 'No phone') + '</div>' +
        '</div>' +
        '<div class="rta-right">' +
          '<div class="rta-amount ' + (bal > 0 ? 'gave' : (bal < 0 ? 'got' : '')) + '" style="font-size:13px;">' + paiseToDisplay(bal) + '</div>' +
          '<div class="rta-date">→</div>' +
        '</div>' +
      '</div>';
    }).join('');
    listHtml = '<div class="card"><h2>Customers (' + state.customers.length + ')</h2>' + items + '</div>';
  }
  return formHtml + listHtml;
}

function addCustomerFromList(){
  var name = document.getElementById('cust-name').value.trim();
  var phone = document.getElementById('cust-phone').value.trim();
  var errEl = document.getElementById('cust-error');
  errEl.textContent = '';
  if (!name) { errEl.textContent = 'Customer name / ID is required.'; return; }
  var dupe = state.customers.find(function(c){ return c.name.toLowerCase() === name.toLowerCase(); });
  if (dupe) { errEl.textContent = 'A customer with this name already exists.'; return; }
  state.customers.push({ id: genId('cust'), name: name, phone: phone });
  saveState(); render();
}

/* ====================================================
   CUSTOMER DETAIL SCREEN
==================================================== */
function renderCustomerDetail(){
  var customer = state.customers.find(function(c){ return c.id === viewingCustomerId; });
  if (!customer) { viewingCustomerId = null; return renderCustomersTab(); }

  var balPaise = customerBalancePaise(customer.id);
  var balClass = balPaise > 0 ? 'pos' : (balPaise < 0 ? 'neg' : 'zero');
  var balLabel = balPaise > 0 ? "Customer owes you" : (balPaise < 0 ? "You owe customer" : 'Settled up');

  var headerHtml;
  if (editingCustomerDetail) {
    headerHtml =
      '<div class="form-row">' +
        '<div><label>Name *</label><input id="edit-cust-name" type="text" value="' + esc(customer.name) + '"></div>' +
        '<div><label>Phone</label><input id="edit-cust-phone" type="tel" value="' + esc(customer.phone || '') + '"></div>' +
      '</div>' +
      '<div class="row-actions">' +
        '<button class="btn btn-primary btn-sm" onclick="saveCustomerDetailEdit()">Save</button>' +
        '<button class="btn btn-secondary btn-sm" onclick="cancelCustomerDetailEdit()">Cancel</button>' +
      '</div>' +
      '<div id="edit-cust-error" class="error-text"></div>';
  } else {
    headerHtml =
      '<div class="cust-detail-header">' +
        '<div>' +
          '<h2>' + esc(customer.name) + '</h2>' +
          '<p class="muted-small">' + esc(customer.phone || 'No phone') +
            ' &nbsp;·&nbsp; <a onclick="startEditCustomerDetail()" style="color:var(--primary);cursor:pointer;">Edit</a>' +
            ' &nbsp;·&nbsp; <a onclick="deleteCustomerFromDetail()" style="color:var(--danger);cursor:pointer;">Delete</a></p>' +
        '</div>' +
        '<button class="btn btn-secondary btn-sm" onclick="shareCustomerSummary(\'' + customer.id + '\')">⬇️ Download</button>' +
      '</div>';
  }

  var balanceHtml =
    '<div class="balance-box ' + balClass + '">' +
      '<div class="balance-label">' + balLabel + '</div>' +
      '<div class="balance-amount">' + paiseToDisplay(Math.abs(balPaise)) + '</div>' +
    '</div>';

  var actionsHtml =
    '<div class="gave-got-row">' +
      '<button class="btn-gave" onclick="togglePanel(\'gave\')">↑ You Gave</button>' +
      '<button class="btn-got" onclick="togglePanel(\'got\')">↓ You Got</button>' +
    '</div>';

  var panelHtml = '';
  if (activePanel === 'gave') panelHtml = renderGavePanel();
  else if (activePanel === 'got') panelHtml = renderGotPanel();

  var txns = state.transactions.filter(function(t){ return t.customerId === customer.id; })
    .sort(function(a, b){ return new Date(b.date) - new Date(a.date); });

  var historyHtml = '<h3 style="margin-top:6px;">Transaction History</h3>';
  if (!txns.length) {
    historyHtml += '<p class="empty">No transactions yet. Use "You Gave" or "You Got" above.</p>';
  } else {
    historyHtml += txns.map(function(t){
      var detail = t.type === 'gave'
        ? t.items.map(function(i){ return esc(i.name) + ' ×' + i.qty; }).join(', ')
        : (t.note ? esc(t.note) : '—');
      var imgHtml = t.imageData ? '<div style="margin-top:6px;"><img src="' + t.imageData + '" class="txn-img-thumb" style="max-height:120px;" alt="attachment"></div>' : '';
      return '<div class="txn-row" style="flex-wrap:wrap;">' +
        '<div class="txn-main"><span class="txn-type ' + t.type + '">' + (t.type === 'gave' ? 'You Gave' : 'You Got') + '</span>' +
          '<span class="txn-date">' + fmtDate(t.date) + '</span></div>' +
        '<div class="txn-detail">' + detail + '</div>' +
        '<div class="txn-amount ' + t.type + '">' + (t.type === 'gave' ? '-' : '+') + paiseToDisplay(t.amountPaise) + '</div>' +
        (imgHtml ? '<div style="width:100%;">' + imgHtml + '</div>' : '') +
        '<div class="txn-actions" style="width:100%;">' +
          '<button class="txn-edit-btn" onclick="startEditTxn(\'' + t.id + '\')">✏️ Edit</button>' +
          ' &nbsp; ' +
          '<button class="txn-delete-btn" onclick="deleteTxn(\'' + t.id + '\')">🗑 Delete</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  return '<div class="card">' +
      '<button class="btn btn-secondary btn-sm" onclick="switchTab(\'customers\')">← Customers</button>' +
      headerHtml + balanceHtml + actionsHtml + panelHtml + historyHtml +
    '</div>';
}

function startEditCustomerDetail(){ editingCustomerDetail = true; render(); }
function cancelCustomerDetailEdit(){ editingCustomerDetail = false; render(); }
function saveCustomerDetailEdit(){
  var name = document.getElementById('edit-cust-name').value.trim();
  var phone = document.getElementById('edit-cust-phone').value.trim();
  var errEl = document.getElementById('edit-cust-error');
  errEl.textContent = '';
  if (!name) { errEl.textContent = 'Customer name is required.'; return; }
  var dupe = state.customers.find(function(c){ return c.name.toLowerCase() === name.toLowerCase() && c.id !== viewingCustomerId; });
  if (dupe) { errEl.textContent = 'A customer with this name already exists.'; return; }
  var c = state.customers.find(function(x){ return x.id === viewingCustomerId; });
  c.name = name; c.phone = phone;
  editingCustomerDetail = false;
  saveState(); render();
}
function deleteCustomerFromDetail(){
  if (!confirm('Delete this customer and all their transaction history? This cannot be undone.')) return;
  var id = viewingCustomerId;
  state.customers = state.customers.filter(function(c){ return c.id !== id; });
  state.transactions = state.transactions.filter(function(t){ return t.customerId !== id; });
  viewingCustomerId = null;
  saveState(); render();
}

function togglePanel(panel){
  activePanel = (activePanel === panel) ? null : panel;
  draftGaveItems = [];
  render();
}
function closePanel(){ activePanel = null; draftGaveItems = []; render(); }

/* ---- "You Gave" panel ---- */
function renderGavePanel(){
  var inner;
  if (!state.products.length) {
    inner = '<p class="empty">No products yet. <a onclick="switchTab(\'products\')" style="color:var(--primary);cursor:pointer;">Add a product first</a>.</p>';
  } else {
    var opts = state.products.map(function(p){
      return '<option value="' + p.id + '">' + esc(p.name) + '</option>';
    }).join('');
    var itemsHtml = '';
    var totalPaise = 0;
    if (draftGaveItems.length) {
      var rows = draftGaveItems.map(function(i){
        var sub = rupeesToPaise(i.price) * i.qty;
        totalPaise += sub;
        return '<tr><td>' + esc(i.name) + '</td><td>₹' + Number(i.price).toFixed(2) + '</td><td>' + i.qty + '</td><td>' + paiseToDisplay(sub) + '</td>' +
          '<td><button class="btn btn-danger btn-sm" onclick="removeGaveItem(\'' + i.productId + '\')">x</button></td></tr>';
      }).join('');
      itemsHtml = '<div class="table-wrap" style="margin-top:10px;"><table>' +
        '<thead><tr><th>Item</th><th>Price</th><th>Qty</th><th>Sub</th><th></th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '<tfoot><tr class="total-row"><td colspan="3">Total</td><td>' + paiseToDisplay(totalPaise) + '</td><td></td></tr></tfoot>' +
        '</table></div>';
    }
    var imgPreviewGave = pendingImageData
      ? '<div class="txn-img-preview-wrap"><img src="' + pendingImageData + '" class="txn-img-thumb" style="max-height:120px;"><button class="txn-img-remove" onclick="clearPendingImage()">×</button></div>'
      : '';
    inner =
      '<div class="form-row-2">' +
        '<div><label>Item</label><select id="gave-product">' + opts + '</select></div>' +
        '<div><label>Qty</label><input id="gave-qty" type="number" min="1" step="1" value="1"></div>' +
      '</div>' +
      '<button class="btn btn-secondary btn-sm" onclick="addGaveItem()">+ Add Item</button>' +
      '<div id="gave-error" class="error-text"></div>' +
      itemsHtml +
      '<div style="margin:10px 0;">' +
        '<label>Attach Image (optional)</label>' +
        '<label class="img-upload-label"><span>📎 Tap to attach image</span><input type="file" accept="image/*" onchange="handleImageUpload(event)"></label>' +
        imgPreviewGave +
      '</div>' +
      '<div class="row-actions" style="margin-top:12px;">' +
        '<button class="btn btn-primary btn-sm" ' + (!draftGaveItems.length ? 'disabled' : '') + ' onclick="saveGaveTransaction()">Save ' + paiseToDisplay(totalPaise) + '</button>' +
        '<button class="btn btn-secondary btn-sm" onclick="closePanel()">Cancel</button>' +
      '</div>';
  }
  return '<div class="panel"><h3 style="margin-top:0;">You Gave — Add Items</h3>' + inner + '</div>';
}

function addGaveItem(){
  var productId = document.getElementById('gave-product').value;
  var qty = parseInt(document.getElementById('gave-qty').value, 10);
  var errEl = document.getElementById('gave-error');
  errEl.textContent = '';
  if (!productId) { errEl.textContent = 'Select an item.'; return; }
  if (!qty || qty <= 0) { errEl.textContent = 'Enter a valid quantity (1 or more).'; return; }
  var product = state.products.find(function(p){ return p.id === productId; });
  if (!product) { errEl.textContent = 'Item not found.'; return; }
  var existing = draftGaveItems.find(function(i){ return i.productId === productId; });
  if (existing) { existing.qty += qty; }
  else { draftGaveItems.push({ productId: productId, name: product.name, price: product.price, qty: qty }); }
  render();
}
function removeGaveItem(productId){
  draftGaveItems = draftGaveItems.filter(function(i){ return i.productId !== productId; });
  render();
}
function saveGaveTransaction(){
  if (!draftGaveItems.length) return;
  var items = draftGaveItems.map(function(i){
    var subtotalPaise = rupeesToPaise(i.price) * i.qty;
    return { productId: i.productId, name: i.name, price: i.price, qty: i.qty, subtotalPaise: subtotalPaise };
  });
  var amountPaise = items.reduce(function(s, i){ return s + i.subtotalPaise; }, 0);
  state.transactions.push({
    id: genId('txn'), customerId: viewingCustomerId, type: 'gave',
    date: new Date().toISOString(), items: items, amountPaise: amountPaise,
    imageData: pendingImageData || null
  });
  draftGaveItems = []; activePanel = null; pendingImageData = null;
  saveState(); render();
}

/* ---- "You Got" panel ---- */
function renderGotPanel(){
  var imgPreview = pendingImageData
    ? '<div class="txn-img-preview-wrap"><img src="' + pendingImageData + '" class="txn-img-thumb" style="max-height:120px;"><button class="txn-img-remove" onclick="clearPendingImage()">×</button></div>'
    : '';
  return '<div class="panel"><h3 style="margin-top:0;">You Got — Record Payment</h3>' +
    '<div class="form-row">' +
      '<div><label>Amount Received (₹) *</label><input id="got-amount" type="number" step="0.01" min="0.01" placeholder="e.g. 500"></div>' +
      '<div><label>Note (optional)</label><input id="got-note" type="text" placeholder="e.g. Cash, UPI"></div>' +
    '</div>' +
    '<div style="margin-bottom:10px;">' +
      '<label>Attach Image (optional)</label>' +
      '<label class="img-upload-label"><span>📎 Tap to attach image</span><input type="file" accept="image/*" onchange="handleImageUpload(event)"></label>' +
      imgPreview +
    '</div>' +
    '<div id="got-error" class="error-text"></div>' +
    '<div class="row-actions">' +
      '<button class="btn btn-primary btn-sm" onclick="saveGotTransaction()">Save</button>' +
      '<button class="btn btn-secondary btn-sm" onclick="closePanel()">Cancel</button>' +
    '</div>' +
  '</div>';
}
function saveGotTransaction(){
  var amount = parseFloat(document.getElementById('got-amount').value);
  var note = document.getElementById('got-note').value.trim();
  var errEl = document.getElementById('got-error');
  errEl.textContent = '';
  if (isNaN(amount) || amount <= 0) { errEl.textContent = 'Enter a valid amount greater than 0.'; return; }
  state.transactions.push({
    id: genId('txn'), customerId: viewingCustomerId, type: 'got',
    date: new Date().toISOString(), amountPaise: rupeesToPaise(amount), note: note,
    imageData: pendingImageData || null
  });
  activePanel = null; pendingImageData = null;
  saveState(); render();
}

/* ====================================================
   IMAGE UPLOAD
==================================================== */
function handleImageUpload(event){
  var file = event.target.files && event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    pendingImageData = e.target.result;
    render();
  };
  reader.readAsDataURL(file);
}
function clearPendingImage(){
  pendingImageData = null;
  render();
}

/* ====================================================
   DELETE TRANSACTION
==================================================== */
function deleteTxn(txnId){
  if (!confirm('Delete this transaction? This cannot be undone.')) return;
  state.transactions = state.transactions.filter(function(t){ return t.id !== txnId; });
  saveState(); render();
}

/* ====================================================
   EDIT TRANSACTION
==================================================== */
function startEditTxn(txnId){
  editingTxnId = txnId;
  render();
  // Inject modal after render
  var txn = state.transactions.find(function(t){ return t.id === txnId; });
  if (!txn) return;
  var modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'edit-txn-modal';

  var imgHtml = txn.imageData
    ? '<div class="txn-img-preview-wrap" style="margin-bottom:10px;"><img src="' + txn.imageData + '" class="txn-img-thumb" style="max-height:120px;" alt="current"><button class="txn-img-remove" onclick="clearEditTxnImage(\'' + txnId + '\')">×</button></div>'
    : '';

  if (txn.type === 'got') {
    modal.innerHTML =
      '<div class="modal-box">' +
        '<p class="modal-title">✏️ Edit Payment Received</p>' +
        '<div class="form-row">' +
          '<div><label>Amount (₹) *</label><input id="etxn-amount" type="number" step="0.01" min="0.01" value="' + (txn.amountPaise / 100).toFixed(2) + '"></div>' +
          '<div><label>Note (optional)</label><input id="etxn-note" type="text" value="' + esc(txn.note || '') + '"></div>' +
        '</div>' +
        '<div style="margin-bottom:10px;"><label>Attachment</label>' + imgHtml +
          '<label class="img-upload-label"><span>📎 Replace / Add Image</span><input type="file" accept="image/*" onchange="handleEditTxnImage(event, \'' + txnId + '\')"></label></div>' +
        '<div id="etxn-error" class="error-text"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-primary btn-sm" onclick="saveEditGotTxn(\'' + txnId + '\')">Save</button>' +
          '<button class="btn btn-secondary btn-sm" onclick="closeEditTxnModal()">Cancel</button>' +
        '</div>' +
      '</div>';
  } else {
    // gave — allow editing the note and image only (items editing is complex; allow amount override)
    var itemsText = txn.items.map(function(i){ return i.name + ' ×' + i.qty; }).join(', ');
    modal.innerHTML =
      '<div class="modal-box">' +
        '<p class="modal-title">✏️ Edit Order Given</p>' +
        '<div class="form-row">' +
          '<div><label>Items</label><input type="text" value="' + esc(itemsText) + '" disabled style="background:#f5f5f5;color:#888;"></div>' +
          '<div><label>Amount (₹) *</label><input id="etxn-amount" type="number" step="0.01" min="0.01" value="' + (txn.amountPaise / 100).toFixed(2) + '"></div>' +
        '</div>' +
        '<div style="margin-bottom:10px;"><label>Attachment</label>' + imgHtml +
          '<label class="img-upload-label"><span>📎 Replace / Add Image</span><input type="file" accept="image/*" onchange="handleEditTxnImage(event, \'' + txnId + '\')"></label></div>' +
        '<div id="etxn-error" class="error-text"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-primary btn-sm" onclick="saveEditGaveTxn(\'' + txnId + '\')">Save</button>' +
          '<button class="btn btn-secondary btn-sm" onclick="closeEditTxnModal()">Cancel</button>' +
        '</div>' +
      '</div>';
  }
  document.body.appendChild(modal);
}

function closeEditTxnModal(){
  var m = document.getElementById('edit-txn-modal');
  if (m) m.remove();
  editingTxnId = null;
}

function handleEditTxnImage(event, txnId){
  var file = event.target.files && event.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var txn = state.transactions.find(function(t){ return t.id === txnId; });
    if (txn) { txn.imageData = e.target.result; saveState(); }
    // Update preview in modal
    var modal = document.getElementById('edit-txn-modal');
    if (modal) {
      var existing = modal.querySelector('.txn-img-preview-wrap');
      if (existing) existing.remove();
      var label = modal.querySelector('.img-upload-label');
      var wrap = document.createElement('div');
      wrap.className = 'txn-img-preview-wrap';
      wrap.style.marginBottom = '10px';
      wrap.innerHTML = '<img src="' + e.target.result + '" class="txn-img-thumb" style="max-height:120px;"><button class="txn-img-remove" onclick="clearEditTxnImage(\'' + txnId + '\')">×</button>';
      label.parentNode.insertBefore(wrap, label);
    }
  };
  reader.readAsDataURL(file);
}

function clearEditTxnImage(txnId){
  var txn = state.transactions.find(function(t){ return t.id === txnId; });
  if (txn) { txn.imageData = null; saveState(); }
  var modal = document.getElementById('edit-txn-modal');
  if (modal) {
    var existing = modal.querySelector('.txn-img-preview-wrap');
    if (existing) existing.remove();
  }
}

function saveEditGotTxn(txnId){
  var amount = parseFloat(document.getElementById('etxn-amount').value);
  var note = document.getElementById('etxn-note').value.trim();
  var errEl = document.getElementById('etxn-error');
  errEl.textContent = '';
  if (isNaN(amount) || amount <= 0) { errEl.textContent = 'Enter a valid amount.'; return; }
  var txn = state.transactions.find(function(t){ return t.id === txnId; });
  if (!txn) return;
  txn.amountPaise = rupeesToPaise(amount);
  txn.note = note;
  saveState();
  closeEditTxnModal();
  render();
}

/* ====================================================
   SHARE AS TEXT (WhatsApp / Copy)
==================================================== */
function shareCustomerSummary(customerId){
  var customer = state.customers.find(function(c){ return c.id === customerId; });
  if (!customer) return;
  var txns = state.transactions
    .filter(function(t){ return t.customerId === customerId; })
    .sort(function(a, b){ return new Date(a.date) - new Date(b.date); });

  var bal = customerBalancePaise(customerId);
  var balLabel = bal > 0
    ? 'Balance: Customer owes ' + paiseToDisplay(bal)
    : (bal < 0 ? 'Balance: You owe ' + paiseToDisplay(Math.abs(bal)) : 'Balance: Settled up');

  try {
    var width = 600, rowHeight = 28, headerHeight = 140, footerHeight = 60;
    var height = headerHeight + Math.max(txns.length, 1) * rowHeight + footerHeight;
    var canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    var ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);

    // Header
    ctx.fillStyle = '#1f2430'; ctx.font = 'bold 20px Arial';
    ctx.fillText('Transaction Summary', 20, 32);
    ctx.font = '13px Arial'; ctx.fillStyle = '#555';
    ctx.fillText('Customer: ' + customer.name, 20, 56);
    if (customer.phone) ctx.fillText('Phone: ' + customer.phone, 20, 74);
    ctx.fillText('Generated: ' + new Date().toLocaleDateString('en-IN'), 20, 92);

    // Table header
    var tableTop = 110;
    ctx.strokeStyle = '#ddd'; ctx.beginPath(); ctx.moveTo(20, tableTop); ctx.lineTo(width - 20, tableTop); ctx.stroke();
    ctx.font = 'bold 12px Arial'; ctx.fillStyle = '#1f2430';
    ctx.fillText('Date', 20, tableTop + 18);
    ctx.fillText('Type', 110, tableTop + 18);
    ctx.fillText('Details', 220, tableTop + 18);
    ctx.fillText('Amount', width - 100, tableTop + 18);
    ctx.strokeStyle = '#bbb'; ctx.beginPath(); ctx.moveTo(20, tableTop + 24); ctx.lineTo(width - 20, tableTop + 24); ctx.stroke();

    // Rows
    var y = tableTop + 24; ctx.font = '11px Arial';
    if (!txns.length) {
      y += 24; ctx.fillStyle = '#888'; ctx.fillText('No transactions yet.', 20, y);
    } else {
      txns.forEach(function(t){
        y += rowHeight; ctx.fillStyle = '#1f2430';
        ctx.fillText(fmtDateShort(t.date), 20, y);
        ctx.fillText(t.type === 'gave' ? 'You Gave' : 'You Got', 110, y);
        var detail = t.type === 'gave'
          ? t.items.map(function(i){ return i.name + ' x' + i.qty; }).join(', ')
          : (t.note || '-');
        if (detail.length > 22) detail = detail.slice(0, 20) + '\u2026';
        ctx.fillText(detail, 220, y);
        ctx.fillStyle = t.type === 'gave' ? '#dc2626' : '#16a34a';
        ctx.font = 'bold 11px Arial';
        ctx.fillText((t.type === 'gave' ? '-' : '+') + paiseToDisplay(t.amountPaise), width - 100, y);
        ctx.font = '11px Arial';
      });
    }

    // Footer balance
    var footerY = y + 38;
    ctx.strokeStyle = '#bbb'; ctx.beginPath(); ctx.moveTo(20, footerY - 18); ctx.lineTo(width - 20, footerY - 18); ctx.stroke();
    ctx.font = 'bold 15px Arial';
    ctx.fillStyle = bal > 0 ? '#dc2626' : (bal < 0 ? '#16a34a' : '#1f2430');
    ctx.fillText(balLabel, 20, footerY);

    // Download as PNG automatically
    var safeName = customer.name.replace(/[^a-z0-9]+/gi, '_');
    canvas.toBlob(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'summary-' + safeName + '.png';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 2000);
    }, 'image/png');

  } catch(e) {
    alert('Could not generate image. Please try again.');
  }
}

/* ====================================================
   RESET
==================================================== */
function resetAllData(){
  // Show custom double-warning modal instead of browser confirm
  var existing = document.getElementById('reset-modal');
  if (existing) existing.remove();

  var modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'reset-modal';
  modal.innerHTML =
    '<div class="modal-box" style="text-align:center;">' +
      '<div style="font-size:42px;margin-bottom:8px;">⚠️</div>' +
      '<p class="modal-title" style="color:#e03131;">Reset All Data?</p>' +
      '<p style="font-size:14px;color:#555;margin:0 0 18px;line-height:1.5;">This will <strong>permanently delete</strong> all products, customers, and transactions.<br>This action <strong>cannot be undone</strong>.</p>' +
      '<div class="modal-actions" style="justify-content:center;">' +
        '<button class="btn btn-secondary btn-sm" onclick="document.getElementById(\'reset-modal\').remove()">Cancel</button>' +
        '<button class="btn btn-danger btn-sm" onclick="resetStep2()">Yes, delete everything</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(modal);
}

function resetStep2(){
  var modal = document.getElementById('reset-modal');
  if (modal) {
    modal.querySelector('.modal-box').innerHTML =
      '<div style="font-size:42px;margin-bottom:8px;">🚨</div>' +
      '<p class="modal-title" style="color:#e03131;">Are you absolutely sure?</p>' +
      '<p style="font-size:14px;color:#555;margin:0 0 6px;line-height:1.5;">You are about to wipe <strong>' + state.customers.length + ' customer(s)</strong>, <strong>' + state.products.length + ' product(s)</strong>, and <strong>' + state.transactions.length + ' transaction(s)</strong>.</p>' +
      '<p style="font-size:13px;color:#e03131;font-weight:700;margin:0 0 18px;">There is no way to recover this data.</p>' +
      '<div class="modal-actions" style="justify-content:center;">' +
        '<button class="btn btn-secondary btn-sm" onclick="document.getElementById(\'reset-modal\').remove()">No, keep my data</button>' +
        '<button class="btn btn-sm" style="background:#e03131;color:#fff;font-weight:700;" onclick="confirmReset()">🗑 Permanently Delete All</button>' +
      '</div>';
  }
}

function confirmReset(){
  var modal = document.getElementById('reset-modal');
  if (modal) modal.remove();
  state = { products: [], customers: [], transactions: [] };
  activeTab = 'dashboard'; viewingCustomerId = null; activePanel = null;
  draftGaveItems = []; editingProductId = null; editingCustomerDetail = false;
  pendingImageData = null; editingTxnId = null;
  saveState(); render();
}
</script>
